spring.application.name=springBatch


spring.datasource.url=jdbc:mysql://localhost:3306/practice
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#if you are working with JPARepository, the below property is must. Otherwise it give this exception - "org.hibernate.LazyInitializationException: Could not initialize proxy [com.akshita.model.Bike#102] - no session"
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

#Suppose you're starting a new project/database and the Spring Batch metadata tables don't exist.
#With below property Spring Boot will run the appropriate Spring Batch schema initialization scripts and create them.
#The project may work fine without below property also, in that case the project would be using another mechanism to create String Batch tables and they already exist in your mySQL db
spring.batch.jdbc.initialize-schema=ALWAYS
